<!DOCTYPE html><html lang="en"><head>
    <meta charset="utf-8">
    <title>Settings · SwishAI</title>
    <base href="/SwishAI-web/">
    <script>
      (() => {
        const base = new URL(document.baseURI);
        const page = new URL(location.href);
        const path = page.pathname.slice(base.pathname.length).replace(/\/$/, '');
        history.scrollRestoration = 'manual';
        if (!page.pathname.startsWith(base.pathname) || !['', 'it', 'es', 'landing'].includes(path)) return;
        let signedIn = false;
        try {
          signedIn = ['swishai_user', 'swishai_access_token', 'swishai_refresh_token']
            .every(key => localStorage.getItem(key));
        } catch {}
        if (page.searchParams.get('source') !== 'pwa' && !signedIn) return;
        document.documentElement.style.visibility = 'hidden';
        location.replace(new URL('diary/', base));
      })();
    </script>
    <script>
      // Chrome fires this once per load, often before the app has booted; InstallService picks it up.
      addEventListener('beforeinstallprompt', event => {
        event.preventDefault();
        window.__swishInstallPrompt = event;
      });
    </script>
